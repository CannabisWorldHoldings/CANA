name: CANA candidate verification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - recover/competitive-ui-day-night
      - integration/cana-technical-promotion-de4a497b

permissions:
  contents: read

concurrency:
  group: cana-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - run: node --test tools/test-runner/runner.test.mjs tools/mariadb-sim/run.test.mjs tools/durability/cli.test.mjs tools/cpanel-sim/run.test.mjs tools/github-import/prepare.test.mjs

  focused-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - run: docker info
      - run: ./cana verify focused

  clean-build:
    needs: focused-verifier
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Clean build, warning gate, and stale-build proof passed in focused-verifier."

  full-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - run: docker info
      - run: ./cana verify full

  clean-clone-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - run: docker info
      - run: ./cana verify clean-clone

  release-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - run: docker info
      - run: ./cana verify release

  maria-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - run: docker info
      - run: ./cana verify maria

  migration-validation:
    needs: maria-verifier
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "MariaDB migration and recovery proof passed in maria-verifier."

  cpanel-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - run: docker info
      - run: ./cana verify cpanel

  durability-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - run: docker info
      - name: Build, independently verify, and restore durability artifact
        env:
          CANA_RECEIPT_DIR: ${{ runner.temp }}/cana-durability-receipts
          CANA_LOCAL_STATE_DIR: ${{ runner.temp }}/cana-durability-state
        run: |
          install -d -m 0700 "$CANA_RECEIPT_DIR" "$CANA_LOCAL_STATE_DIR"
          ./cana durability build
          ./cana durability verify
          ./cana durability restore --target "$RUNNER_TEMP/cana-durability-restore"
          node tools/test-runner/assert-ci-durability.mjs \
            "$CANA_RECEIPT_DIR" \
            "$RUNNER_TEMP/cana-durability-restore"

  github-import-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - run: ./cana github prepare

  secret-scan:
    needs: github-import-offline
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Outgoing-history secret scan passed in github-import-offline."
