name: CANA candidate verification

on:
  pull_request:
  push:
    branches:
      - main
      - recover/competitive-ui-day-night

permissions:
  contents: read

concurrency:
  group: cana-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Run candidate units and evaluator sabotage certification
        run: node --test tools/test-runner/runner.test.mjs tools/mariadb-sim/run.test.mjs tools/durability/cli.test.mjs tools/cpanel-sim/run.test.mjs tools/github-import/prepare.test.mjs tools/mission-2/mission-2.test.mjs tools/growth-foundry/m001/claim-graph.test.mjs tools/provenance-court/sabotage.test.mjs tools/reality/verify-evidence-packet.test.mjs tools/reality/verify-slice2-evidence-packet.test.mjs apps/web/tests/migration-manifest.test.mjs apps/web/tests/live-abca-adapter.test.mjs apps/web/tests/live-reality-acquisition.test.mjs apps/web/tests/live-reality-court.test.mjs apps/web/tests/answerability-frontier.test.mjs apps/web/tests/ask-frontier-dedupe.test.mjs apps/web/tests/reality-cognitive-evolution.test.mjs apps/web/tests/security-boundary.test.mjs apps/web/tests/tenant-rewrite.test.mjs

  focused-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - run: docker info
      - run: ./cana verify focused

  maria-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - run: docker info
      - run: ./cana verify maria

  cpanel-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - run: docker info
      - run: ./cana verify cpanel

  durability-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - run: docker info
      - name: Build, independently verify, and restore durability artifact
        env:
          CANA_RECEIPT_DIR: ${{ runner.temp }}/cana-durability-receipts
          CANA_LOCAL_STATE_DIR: ${{ runner.temp }}/cana-durability-state
        run: |
          install -d -m 0700 "$CANA_RECEIPT_DIR" "$CANA_LOCAL_STATE_DIR"
          ./cana durability build
          ./cana durability verify
          ./cana durability restore --target "$RUNNER_TEMP/cana-durability-restore"
          node tools/test-runner/assert-ci-durability.mjs \
            "$CANA_RECEIPT_DIR" \
            "$RUNNER_TEMP/cana-durability-restore"

  github-import-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - run: ./cana github prepare
