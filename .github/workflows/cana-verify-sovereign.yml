# CANA SOVEREIGN VERIFICATION
# ===========================
# `./cana verify sovereign` is a fifteen-stage composition (see tools/test-runner/sovereign.mjs).
# Eight of its stages need an environment that a plain agent container does not have:
# a PostgreSQL/PostGIS server, an installed dependency tree, a production build and a
# browser binary. Those stages report ENVIRONMENT_MISSING locally — never a pass — and
# this workflow exists to supply exactly what is missing so they can report VERIFIED.
#
# Two jobs, deliberately:
#   sovereign-postgis   the postgis/postgis service container with a health check.
#                       Proves everything except the H3 geo DDL, which the stock
#                       postgis/postgis image does not carry.
#   sovereign-h3        builds the repository's OWN database image
#                       (tools/postgres-sim/Dockerfile — PostGIS 3 + h3-pg pinned by
#                       commit and sha256) so the geo_kernel migration's
#                       `CREATE EXTENSION h3` can actually succeed.
# Both upload the sovereign receipt and the artifact-hash manifest.
#
# ACTION PINNING: actions/checkout and actions/setup-node are pinned to the exact
# commit SHAs already trusted by .github/workflows/cana-verify.yml in this repository.
# actions/upload-artifact is pinned to the v4 release tag; replace it with the resolved
# 40-hex commit SHA (`gh api repos/actions/upload-artifact/git/ref/tags/v4`) before this
# workflow becomes a merge gate.

name: CANA sovereign verification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - hyperagent/cana-sovereign-successor

permissions:
  contents: read

concurrency:
  group: cana-verify-sovereign-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: cana_verify

jobs:
  # ---------------------------------------------------------------------------
  # PRIMARY: postgis/postgis service container with a health check.
  # ---------------------------------------------------------------------------
  sovereign-postgis:
    name: verify sovereign (postgis service container)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cana_verify
          PGDATA: /var/lib/postgresql/data/pgdata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname cana_verify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cana_verify
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/cana_verify
      CANA_VISUAL_BASE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Route CI byproducts outside the verified tree
        # runner context is invalid in job-level env; RUNNER_TEMP is a plain
        # env var at step runtime, exported for every later step via GITHUB_ENV.
        run: |
          echo "CANA_RECEIPT_DIR=$RUNNER_TEMP/cana-ci/receipts" >> "$GITHUB_ENV"
          echo "CANA_SOVEREIGN_RECEIPT_COPY=$RUNNER_TEMP/cana-ci/verify-sovereign.json" >> "$GITHUB_ENV"
          echo "CANA_SOURCE_MIRROR=$RUNNER_TEMP/cana-ci/source-mirror.git" >> "$GITHUB_ENV"

      - name: Set up Node with dependency caching
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: true
          cache-dependency-path: package-lock.json

      - name: Prepare receipt and mirror directories
        run: |
          install -d -m 0700 "${{ runner.temp }}/cana-ci" "$CANA_RECEIPT_DIR"

      - name: Provide the reference object database for stage 02 (source identity)
        # Stage 02 proves the three source SHAs and their common base against a real
        # object database. A --mirror clone of this checkout carries every commit the
        # remote has; if a pinned SHA is unreachable the stage says ENVIRONMENT_MISSING
        # rather than pretending the identity was proved.
        run: git clone --mirror "${{ github.workspace }}" "$CANA_SOURCE_MIRROR"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the Prisma client
        working-directory: apps/web
        run: npx --no-install prisma generate

      - name: Wait for PostGIS and confirm the extension surface
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d cana_verify; then break; fi
            sleep 2
          done
          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d cana_verify
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d cana_verify \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;" \
            -c "SELECT postgis_full_version();"
          # Honest probe, not a gate: the stock postgis image has no h3.
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d cana_verify -tAc \
            "SELECT count(*) FROM pg_available_extensions WHERE name IN ('h3','h3_postgis');"

      - name: Apply the migration chain
        working-directory: apps/web
        run: npx --no-install prisma migrate deploy --schema prisma/schema.prisma

      - name: Issue the disposable-database system identity (out of band)
        # WEB_COURT_TRIAGE R2/R3-identity (postgis lane). Same contract as the H3
        # job: read the connected cluster's immutable system_identifier out of band
        # and export it (plus the benchmark server URL) for later steps. The
        # service container is reachable on 127.0.0.1:5432; psql is already used
        # above for the PostGIS probe. GITHUB_ENV, not job-level env.
        run: |
          system_identifier="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d cana_verify -Atc \
            'SELECT system_identifier FROM pg_control_system()')"
          case "$system_identifier" in
            ''|*[!0-9]*)
              echo "disposable system identifier could not be read out of band: '$system_identifier'" >&2
              exit 1 ;;
          esac
          if [ "${#system_identifier}" -lt 10 ]; then
            echo "disposable system identifier is too short to be a cluster id: '$system_identifier'" >&2
            exit 1
          fi
          echo "CANA_DISPOSABLE_DATABASE_SYSTEM_IDENTIFIER=$system_identifier" >> "$GITHUB_ENV"
          echo "CANA_BENCHMARK_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/cana_verify" >> "$GITHUB_ENV"

      - name: Seed the disposable tenant, brand and merchant fixtures
        # WEB_COURT_TRIAGE R1 (postgis lane). Seed the orderweeddc.localhost tenant
        # so the web courts' fixtures build and the served app resolves the tenant.
        # seed.mjs is hard-gated by seed-safety against the verified loopback
        # cluster identity; it writes ONLY DEMONSTRATION_ONLY rows; no override.
        working-directory: apps/web
        env:
          NODE_ENV: development
        run: node prisma/seed.mjs

      - name: Build apps/web for production
        working-directory: apps/web
        env:
          CANA_RELEASE_SHA: ${{ github.sha }}
        run: npm run build -- --webpack

      - name: Install the Chromium binary for the rendered visual court
        # Playwright is used ONLY as a browser provisioner. The rendered court
        # (tools/visual-court/screenshot-harness.mjs) drives the binary over raw CDP
        # and has no npm dependency on Playwright.
        run: npx --yes playwright install --with-deps chromium

      - name: Serve the production build for the rendered visual court
        working-directory: apps/web
        env:
          PORT: '3000'
          HOSTNAME: 127.0.0.1
          NODE_ENV: production
        run: |
          npm start -- -H 127.0.0.1 -p 3000 > "${{ runner.temp }}/cana-ci/next-start.log" 2>&1 &
          echo $! > "${{ runner.temp }}/cana-ci/next.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS -H 'Host: orderweeddc.localhost' http://127.0.0.1:3000/api/health > /dev/null; then
              echo "server healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "the production server never became healthy" >&2
          cat "${{ runner.temp }}/cana-ci/next-start.log" >&2
          exit 1

      - name: ./cana verify sovereign
        run: ./cana verify sovereign

      - name: Stop the production server
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/cana-ci/next.pid" ]; then
            kill "$(cat "${{ runner.temp }}/cana-ci/next.pid")" 2>/dev/null || true
          fi

      - name: Extract the artifact-hash manifest from the receipt
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            const file = process.env.CANA_SOVEREIGN_RECEIPT_COPY;
            if (!fs.existsSync(file)) { console.error("no sovereign receipt was written"); process.exit(0); }
            const receipt = JSON.parse(fs.readFileSync(file, "utf8"));
            const manifest = receipt.artifactManifest ?? { artifacts: [], manifestDigest: null };
            const lines = manifest.artifacts.map((a) => `${a.sha256}  ${a.path}`);
            lines.push(`# manifest digest ${manifest.manifestDigest}`);
            lines.push(`# stages digest   ${receipt.stagesDigest}`);
            lines.push(`# verdict         ${receipt.verdict}`);
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/cana-ci/ARTIFACT_HASHES.txt`, `${lines.join("\n")}\n`);
            const table = receipt.stages.map((s) => `${s.id}  ${s.key.padEnd(24)} ${s.classification}`);
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/cana-ci/STAGE_TABLE.txt`, `${table.join("\n")}\n`);
          '

      - name: Upload the sovereign receipt and artifact hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cana-sovereign-postgis-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/cana-ci/verify-sovereign.json
            ${{ runner.temp }}/cana-ci/ARTIFACT_HASHES.txt
            ${{ runner.temp }}/cana-ci/STAGE_TABLE.txt
            ${{ runner.temp }}/cana-ci/receipts/**
            ${{ runner.temp }}/cana-ci/next-start.log

  # ---------------------------------------------------------------------------
  # SUPPLEMENT: the repository's own PostGIS + H3 image, so the geo_kernel
  # migration's `CREATE EXTENSION h3` is genuinely exercised.
  # ---------------------------------------------------------------------------
  sovereign-h3:
    name: verify sovereign (repository PostGIS + H3 image)
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/cana_verify
      DIRECT_URL: postgresql://postgres@127.0.0.1:5432/cana_verify
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Route CI byproducts outside the verified tree
        # runner context is invalid in job-level env; RUNNER_TEMP is a plain
        # env var at step runtime, exported for every later step via GITHUB_ENV.
        run: |
          echo "CANA_RECEIPT_DIR=$RUNNER_TEMP/cana-ci/receipts" >> "$GITHUB_ENV"
          echo "CANA_SOVEREIGN_RECEIPT_COPY=$RUNNER_TEMP/cana-ci/verify-sovereign.json" >> "$GITHUB_ENV"
          echo "CANA_SOURCE_MIRROR=$RUNNER_TEMP/cana-ci/source-mirror.git" >> "$GITHUB_ENV"

      - name: Resolve the tenant hosts to loopback for the rendered visual court
        # WEB_COURT_TRIAGE R7/A1. The app routes '/' to the [domain] layout (which
        # renders <header>) by REWRITING on the request Host: only a configured
        # tenant host resolves; 127.0.0.1 does not, so the served '/' rendered no
        # <header> and A1.header-height saw header=null at all 22 samples. Chromium
        # special-cases the .localhost TLD to loopback, but the runner's own Node
        # reachability probe (tools/test-runner/sovereign-env.mjs, unchanged) uses
        # libc resolution, which does not. Map the canonical tenant host (and its
        # siblings) to 127.0.0.1 so BOTH the probe and the browser reach the served
        # build under the tenant Host — the layout then renders exactly as it does
        # statically (static floor + visual-court.test.mjs already VERIFIED). This
        # is environment resolution only; no court, threshold, or markup changed.
        run: |
          echo "127.0.0.1 orderweeddc.localhost deals.localhost luxury.localhost value.localhost flower.localhost edibles.localhost wellness.localhost accessories.localhost events.localhost biz.localhost" | sudo tee -a /etc/hosts

      - name: Set up Node with dependency caching
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: true
          cache-dependency-path: package-lock.json

      - name: Prepare receipt and mirror directories
        run: |
          install -d -m 0700 "${{ runner.temp }}/cana-ci" "$CANA_RECEIPT_DIR"
          git clone --mirror "${{ github.workspace }}" "$CANA_SOURCE_MIRROR"

      - name: Build the repository PostGIS + H3 database image
        run: |
          docker build \
            --tag cana-postgres-sim:ci \
            --file tools/postgres-sim/Dockerfile \
            tools/postgres-sim

      - name: Start the database and wait for health
        # POSTMASTER-CRASH FIX (WEB_COURT_TRIAGE R3). The decisive run's
        # next-start.log showed repeated SqlState 57P01 "terminating connection
        # due to unexpected postmaster exit" (be-secure.c:235): the postmaster
        # died mid-run and took stages 09/12 down with it. The stock container's
        # /dev/shm defaults to 64 MB; PostgreSQL keeps parallel-query and hash/
        # bitmap shared segments there, and PostGIS+H3 spatial work under the web
        # courts exhausts it, crashing the postmaster. Give it a real shared-memory
        # segment (--shm-size=1g) and bound its own memory so it cannot be OOM-
        # killed: modest shared_buffers, capped connections, and parallelism off
        # (the courts are correctness proofs, not a throughput benchmark). This
        # changes the RUN CONFIGURATION only — no test, threshold, or court code.
        run: |
          docker run --detach --name cana-postgres-ci \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --env POSTGRES_DB=cana_verify \
            --shm-size=1g \
            --publish 127.0.0.1:5432:5432 \
            --health-cmd "pg_isready --username postgres --dbname cana_verify" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 20 \
            cana-postgres-sim:ci \
            -c shared_buffers=256MB \
            -c max_connections=100 \
            -c max_parallel_workers_per_gather=0 \
            -c max_parallel_workers=0 \
            -c max_parallel_maintenance_workers=0 \
            -c dynamic_shared_memory_type=posix
          for attempt in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Health.Status}}' cana-postgres-ci)
            if [ "$state" = "healthy" ]; then break; fi
            sleep 3
          done
          docker inspect --format '{{.State.Health.Status}}' cana-postgres-ci | grep -qx healthy
          docker exec cana-postgres-ci psql -U postgres -d cana_verify -tAc \
            "SELECT string_agg(name, ',') FROM pg_available_extensions WHERE name IN ('postgis','h3','h3_postgis');"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the Prisma client
        working-directory: apps/web
        run: npx --no-install prisma generate

      - name: Apply the migration chain against PostGIS + H3
        working-directory: apps/web
        run: npx --no-install prisma migrate deploy --schema prisma/schema.prisma

      - name: Issue the disposable-database system identity (out of band)
        # WEB_COURT_TRIAGE R2/R3-identity. seed-safety.mjs (docs/adr/0001) and the
        # postgres-semantics / tri-market / migration-court courts refuse a loopback
        # PostgreSQL URL UNLESS a CANA_DISPOSABLE_DATABASE_SYSTEM_IDENTIFIER,
        # read OUT OF BAND from the cluster, is presented and matches
        # pg_control_system().system_identifier of the connected server. This is
        # exactly what tools/postgres-sim/runtime.mjs does for local verification;
        # in CI the disposable cluster is the cana-postgres-ci container, so read
        # its immutable system identifier straight from it and export it (plus the
        # benchmark server URL that points at that same cluster) for every later
        # step. GITHUB_ENV, not job-level env: the runner context is invalid there.
        run: |
          system_identifier="$(docker exec cana-postgres-ci \
            psql -U postgres -d cana_verify -Atc \
            'SELECT system_identifier FROM pg_control_system()')"
          case "$system_identifier" in
            ''|*[!0-9]*)
              echo "disposable system identifier could not be read out of band: '$system_identifier'" >&2
              exit 1 ;;
          esac
          if [ "${#system_identifier}" -lt 10 ]; then
            echo "disposable system identifier is too short to be a cluster id: '$system_identifier'" >&2
            exit 1
          fi
          echo "CANA_DISPOSABLE_DATABASE_SYSTEM_IDENTIFIER=$system_identifier" >> "$GITHUB_ENV"
          # The product benchmark provisions and drops its OWN isolated databases
          # on this loopback cluster; it verifies the server identity against the
          # same out-of-band identifier before any DDL. current_database() must
          # equal the URL pathname, so it points at cana_verify.
          echo "CANA_BENCHMARK_DATABASE_URL=postgresql://postgres@127.0.0.1:5432/cana_verify" >> "$GITHUB_ENV"

      - name: Seed the disposable tenant, brand and merchant fixtures
        # WEB_COURT_TRIAGE R1. The workflow applied migrations but never seeded, so
        # the orderweeddc.localhost tenant/brand/merchant rows the web courts build
        # their fixtures from were absent — createFixture() threw "tenant
        # orderweeddc.localhost is not configured" and merchant() returned null,
        # cascading ~106 assertion failures across api-v1-*, attribution-
        # idempotency, handoff-grading, pilot-evidence-chain, and starving the
        # served app's tenant resolution (release-gate G2/G6 421; rendered header
        # null). prisma/seed.mjs is HARD-GATED by seed-safety: it only writes to a
        # loopback cluster whose out-of-band system identity it can verify — which
        # is exactly the disposable cana_verify cluster above. The seed introduces
        # ONLY DEMONSTRATION_ONLY rows. No override flag is used; the gate passes on
        # its merits. (.cana-local/ is gitignored, so this leaves the tree clean.)
        working-directory: apps/web
        env:
          NODE_ENV: development
        run: node prisma/seed.mjs

      - name: Build apps/web for production
        working-directory: apps/web
        env:
          CANA_RELEASE_SHA: ${{ github.sha }}
        run: npm run build -- --webpack

      - name: Install the Chromium binary for the rendered visual court
        run: npx --yes playwright install --with-deps chromium

      - name: Serve the production build for the rendered visual court
        working-directory: apps/web
        env:
          PORT: '3000'
          HOSTNAME: 127.0.0.1
          NODE_ENV: production
          # WEB_COURT_TRIAGE handoff-grading fix (MISSING_SERVICE). The retailer
          # render (src/app/[domain]/retailer/[id]/page.tsx) mints a page-bound
          # challenge, and the handoff route (.../handoff/route.ts) + attribution
          # API verify it, both reading process.env.CANA_INTERACTION_SECRET. With
          # it unset the render embedded no challenge, so every valid-challenge
          # handoff demoted to APPLICATION_HANDOFF_VERIFIED and no valued action
          # was recorded (4 handoff-grading assertions failed). This is a served-app
          # runtime secret the environment must supply; it is a disposable CI value,
          # NOT a production credential, and it is deliberately deterministic so the
          # render and the route derive the same signing key within this run.
          CANA_INTERACTION_SECRET: cana-ci-disposable-interaction-secret-32341050682
        run: |
          npm start -- -H 127.0.0.1 -p 3000 > "${{ runner.temp }}/cana-ci/next-start.log" 2>&1 &
          echo $! > "${{ runner.temp }}/cana-ci/next.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS -H 'Host: orderweeddc.localhost' http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "the production server never became healthy" >&2
          cat "${{ runner.temp }}/cana-ci/next-start.log" >&2
          exit 1

      - name: ./cana verify sovereign
        env:
          # Navigate the rendered visual court at the CANONICAL TENANT HOST so the
          # Host-based rewrite resolves '/' to the [domain] layout and the <header>
          # renders (A1). orderweeddc.localhost is mapped to 127.0.0.1 above; the
          # served app listens on 127.0.0.1:3000. WEB_COURT_TRIAGE R7/A1.
          CANA_VISUAL_BASE_URL: http://orderweeddc.localhost:3000
        run: ./cana verify sovereign

      - name: Tear down
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/cana-ci/next.pid" ]; then
            kill "$(cat "${{ runner.temp }}/cana-ci/next.pid")" 2>/dev/null || true
          fi
          docker rm --force cana-postgres-ci 2>/dev/null || true

      - name: Extract the artifact-hash manifest from the receipt
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            const file = process.env.CANA_SOVEREIGN_RECEIPT_COPY;
            if (!fs.existsSync(file)) { console.error("no sovereign receipt was written"); process.exit(0); }
            const receipt = JSON.parse(fs.readFileSync(file, "utf8"));
            const manifest = receipt.artifactManifest ?? { artifacts: [], manifestDigest: null };
            const lines = manifest.artifacts.map((a) => `${a.sha256}  ${a.path}`);
            lines.push(`# manifest digest ${manifest.manifestDigest}`);
            lines.push(`# stages digest   ${receipt.stagesDigest}`);
            lines.push(`# verdict         ${receipt.verdict}`);
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/cana-ci/ARTIFACT_HASHES.txt`, `${lines.join("\n")}\n`);
            const table = receipt.stages.map((s) => `${s.id}  ${s.key.padEnd(24)} ${s.classification}`);
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/cana-ci/STAGE_TABLE.txt`, `${table.join("\n")}\n`);
          '

      - name: Upload the sovereign receipt and artifact hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cana-sovereign-h3-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/cana-ci/verify-sovereign.json
            ${{ runner.temp }}/cana-ci/ARTIFACT_HASHES.txt
            ${{ runner.temp }}/cana-ci/STAGE_TABLE.txt
            ${{ runner.temp }}/cana-ci/receipts/**
            ${{ runner.temp }}/cana-ci/next-start.log
