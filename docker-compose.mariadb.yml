services:
  maria:
    image: mariadb:11.4.9
    environment:
      MARIADB_DATABASE: cana
      MARIADB_ROOT_PASSWORD: ${CANA_MARIA_ROOT_PASSWORD:?set a disposable simulation password}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/mysql:rw,noexec,nosuid,size=768m
    networks:
      - isolated

networks:
  isolated:
    internal: true
